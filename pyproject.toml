[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dartsmod"
version = "0.1.0"
description = "A world-class darts match prediction engine using visit-level Monte Carlo simulation."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "DartsMod" }]
keywords = ["darts", "monte-carlo", "simulation", "prediction", "sports-modelling"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0", "httpx>=0.24"]
api = ["fastapi>=0.100", "uvicorn[standard]>=0.23"]

[project.scripts]
dartsmod = "dartsmod.cli:main"

[tool.setuptools.packages.find]
include = ["dartsmod*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
